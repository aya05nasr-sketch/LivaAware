<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LivaAware</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6F7;--soft:#F0E2E8;--rose:#D8B9C7;--mauve:#AD8299;--deep:#68485D;--card:#fff;--tx:#3a2a35;--tx2:#6f5d68;--bd:#ead9e0;--btn:#68485D;--btnh:#523648;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1519;--soft:#2c2128;--card:#251c22;--tx:#f6eaf0;--tx2:#c3aeb9;--bd:#3d2e37;--deep:#e6c9d8;--rose:#6b4a5d;--btn:#AD8299;--btnh:#c093ab}}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.75}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--mauve);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:16px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.25rem;color:var(--deep)}
.brand img{width:40px;height:40px;object-fit:contain}
nav{display:flex;gap:22px;margin-inline-start:auto;font-size:.92rem;color:var(--tx2)}
nav a:hover{color:var(--deep)}
.btn{display:inline-block;border:1.5px solid var(--btn);color:var(--btn);background:transparent;padding:9px 20px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.btn.fill{background:var(--btn);color:#fff}
.btn.fill:hover{background:var(--btnh)}
.lang{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.hero{display:grid;grid-template-columns:1.05fr 1fr;border-radius:32px;overflow:hidden;background:var(--card);border:1px solid var(--bd);margin-top:8px}
.hero-t{padding:64px 48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-size:clamp(2rem,4.4vw,3.1rem);line-height:1.3;margin:0;color:var(--deep);font-weight:500}
.hero-t p{margin:0;color:var(--tx2);max-width:46ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.hero-v{position:relative;min-height:440px;background:linear-gradient(155deg,#AD8299,#68485D);display:grid;place-items:center;overflow:hidden}
.hero-v::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(251,246,247,.12);inset-inline-end:-120px;bottom:-140px}
.hero-v .lg{width:min(74%,330px);aspect-ratio:1;position:relative;background:#FBF6F7;border-radius:50%;display:grid;place-items:center;box-shadow:0 24px 50px rgba(50,25,40,.35)}
.hero-v .lg img{width:78%}
.chip-f{position:absolute;background:var(--card);color:var(--tx);border-radius:16px;padding:10px 14px;font-size:.82rem;box-shadow:0 8px 24px rgba(40,15,30,.25)}
.chip-f b{display:block;color:var(--deep);font-size:.98rem}
.c1{top:34px;inset-inline-start:26px}.c2{bottom:38px;inset-inline-start:26px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);margin:56px 0 24px}
.pillars div{padding:4px 28px;border-inline-start:3px solid var(--rose)}
.pillars h3{margin:0 0 4px;font-size:1.05rem;color:var(--deep);font-weight:500}
.pillars p{margin:0;color:var(--tx2);font-size:.92rem}
h2{font-size:1.6rem;color:var(--deep);margin:56px 0 6px;font-weight:500}
.sub{color:var(--tx2);margin:0 0 20px;max-width:62ch}
.demo{display:grid;grid-template-columns:210px 1fr;border:1px solid var(--bd);border-radius:26px;overflow:hidden;background:var(--card)}
.side{background:var(--soft);padding:18px 12px;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.side .brand{font-size:1rem;padding:0 8px 12px}.side .brand img{width:30px;height:30px}
.side button{all:unset;cursor:pointer;padding:9px 12px;border-radius:12px;color:var(--tx2)}
.side button.on{background:var(--btn);color:#fff}
.side small{margin-top:auto;padding:8px 12px;color:var(--tx2);font-size:.72rem}
.main{padding:24px;min-width:0}
.panel{display:none}.panel.on{display:block}
.welcome{background:var(--soft);border-radius:18px;padding:18px 22px;margin-bottom:18px}
.welcome b{font-size:1.1rem;color:var(--deep);font-weight:500}
.welcome p{margin:2px 0 10px;color:var(--tx2);font-size:.9rem}
.bar{height:8px;border-radius:8px;background:var(--card);max-width:320px;overflow:hidden}
.bar i{display:block;height:100%;width:72%;background:var(--mauve)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{border:1px solid var(--bd);border-radius:16px;padding:12px 16px}
.stat b{font-size:1.5rem;color:var(--deep);display:block;line-height:1.2;font-weight:500}
.stat span{font-size:.8rem;color:var(--tx2)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:540px}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--bd)}
th{background:var(--bg);color:var(--tx2);font-weight:500}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--tx2)}
.st{display:inline-block;padding:2px 12px;border-radius:20px;font-size:.78rem;font-weight:500}
.s-a{background:var(--deep);color:var(--bg)}.s-h{background:var(--rose);color:#3a2a35}.s-d{background:var(--soft);color:var(--tx2);border:1px solid var(--bd)}
.note{font-size:.8rem;color:var(--tx2);margin-top:10px}
h4{margin:0 0 8px;font-weight:500;color:var(--deep);font-size:1.05rem}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.pk{border:1.5px solid var(--rose);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 16px;font:inherit;font-size:.86rem;cursor:pointer}
.pk[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:#fff}
.res{border:1px solid var(--bd);border-radius:18px;padding:16px 18px;margin-bottom:12px;background:var(--bg)}
.res h5{margin:0 0 4px;font-size:1rem;font-weight:500;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.res p{margin:4px 0;font-size:.88rem;color:var(--tx2)}
.meta{font-size:.78rem;color:var(--tx2);border-top:1px dashed var(--bd);margin-top:8px;padding-top:8px}
.warn{background:var(--soft);border-radius:14px;padding:12px 16px;font-size:.85rem;margin-top:14px}
input[type=search]{width:100%;border:1.5px solid var(--rose);border-radius:999px;padding:10px 18px;font:inherit;background:var(--card);color:var(--tx);margin:10px 0 16px}
.dc{border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:12px}
.dc h5{margin:0;font-size:1.05rem;font-weight:500;color:var(--deep)}
.dc dl{display:grid;grid-template-columns:130px 1fr;gap:4px 14px;margin:10px 0 0;font-size:.87rem}
.dc dt{color:var(--tx2)}.dc dd{margin:0}
.dose{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:.84rem}
.soon{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.soon div{border:1px dashed var(--mauve);border-radius:18px;padding:18px;background:var(--card)}
.soon b{color:var(--deep);font-weight:500}.soon p{margin:4px 0 0;font-size:.88rem;color:var(--tx2)}
.tag{font-size:.72rem;background:var(--soft);color:var(--deep);padding:1px 10px;border-radius:12px;margin-inline-start:8px}
footer{margin-top:64px;border-top:1px solid var(--bd);padding:28px 0 40px;color:var(--tx2);font-size:.85rem}
footer p{max-width:80ch}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hero-t{padding:40px 24px}.pillars,.soon,.stats{grid-template-columns:1fr}.pillars div{margin-bottom:14px}.demo{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}.side small,.side .brand{display:none}.side button{white-space:nowrap}nav,.hide-m{display:none}.lang{margin-inline-start:auto}.dc dl{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.hero-v .lg{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px)}}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}label{font-size:.85rem;color:var(--tx2);display:flex;flex-direction:column;gap:2px}input[type=date],input[type=number],select{border:1.5px solid var(--rose);border-radius:12px;padding:6px 10px;font:inherit;background:var(--card);color:var(--tx)}.soonc{border:1px dashed var(--mauve);border-radius:16px;padding:12px 16px;margin:14px 0;font-size:.86rem;color:var(--tx2);background:var(--card)}.pk input{accent-color:var(--btn)}.bars{display:flex;gap:8px;align-items:flex-end;height:110px;margin:8px 0 14px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.bars i{display:block;width:100%;max-width:34px;background:var(--mauve);border-radius:8px 8px 0 0}.bars b{font-size:.68rem;font-weight:400;color:var(--tx2)}.bars small{font-size:.68rem;color:var(--tx2)}.prog{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--mauve)}.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--soft);margin:0 2px}.dot.on{background:var(--deep)}.res textarea{width:100%;border:1.5px solid var(--rose);border-radius:12px;padding:8px 10px;font:inherit;background:var(--card);color:var(--tx);resize:vertical}.res input:not([type=checkbox]):not([type=date]):not([type=number]){border:1.5px solid var(--rose);border-radius:12px;padding:6px 10px;font:inherit;background:var(--card);color:var(--tx)}
</style>
</head>
<body>
<div class="wrap">
<header>
 <a class="brand" href="#"><img data-logo alt=""><span>LivaAware</span></a>
 <nav><a href="#features" data-i="n1"></a><a href="#preview" data-i="n2"></a><a href="#soon" data-i="n3"></a></nav>
 <button class="lang" id="lang" aria-label="Language"></button>
 <a class="btn hide-m" href="#preview" data-i="login"></a>
 <a class="btn fill hide-m" href="#preview" data-i="create"></a>
</header>
<section class="hero">
 <div class="hero-t"><h1 data-i="h1"></h1><p data-i="lead"></p>
  <div class="cta"><a class="btn fill" href="#preview" data-i="create"></a><a class="btn" href="#preview" data-i="see"></a></div></div>
 <div class="hero-v"><div class="lg"><img data-logo alt="LivaAware"></div>
  <div class="chip-f c1"><b data-i="f1t"></b><span data-i="f1"></span></div>
  <div class="chip-f c2"><b data-i="f2t"></b><span data-i="f2"></span></div></div>
</section>
<section class="pillars" id="features">
 <div><h3 data-i="p1t"></h3><p data-i="p1"></p></div><div><h3 data-i="p2t"></h3><p data-i="p2"></p></div><div><h3 data-i="p3t"></h3><p data-i="p3"></p></div>
</section>

<h2 id="preview" data-i="h2"></h2><p class="sub" data-i="h2s"></p><p class="note" id="who"></p>
<div id="auth"></div><div id="onb" style="display:none"></div>
<div class="demo">
 <aside class="side" role="tablist">
  <div class="brand"><img data-logo alt=""><span>LivaAware</span></div>
  <div id="navb" style="display:contents"></div>
  <small data-i="demo"></small>
 </aside>
 <div class="main">
  <div class="panel on" id="dash">
   <div class="welcome"><b data-i="wel"></b><p data-i="welp"></p><div class="bar" role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100"><i></i></div></div>
   <div class="stats"><div class="stat"><b>3</b><span data-i="s1"></span></div><div class="stat"><b>1</b><span data-i="s2"></span></div><div class="stat"><b>2</b><span data-i="s3"></span></div></div>
   <div class="tw"><table><thead><tr><th data-i="t1"></th><th data-i="t2"></th><th data-i="t3"></th><th data-i="t4"></th></tr></thead><tbody>
    <tr><td><b>Warfarin</b><small>5 mg</small></td><td data-i="r1"></td><td><span class="st s-a" data-i="a"></span></td><td>2025-03-12</td></tr>
    <tr><td><b>Aspirin</b><small>75 mg</small></td><td data-i="r2"></td><td><span class="st s-a" data-i="a"></span></td><td>2025-03-12</td></tr>
    <tr><td><b>Amoxicillin/Clavulanate</b><small>1 g</small></td><td data-i="r3"></td><td><span class="st s-d" data-i="d"></span></td><td>2026-10-20</td></tr>
    <tr><td><b>Ginkgo biloba</b><small>120 mg</small></td><td data-i="r4"></td><td><span class="st s-h" data-i="h"></span></td><td>2026-06-02</td></tr>
   </tbody></table></div>
   <p class="note" data-i="note"></p>
  </div>
  <div class="panel" id="safe">
   <h4 data-i="sh"></h4><p class="sub" data-i="shs"></p>
   <div class="picks" id="picks"></div><div id="out"></div>
   <div class="warn" data-i="sw"></div>
  </div>
  <div class="panel" id="lib">
   <h4 data-i="lh"></h4><p class="sub" data-i="lhs"></p>
   <input type="search" id="q" data-ph="ph"><div id="cards"></div>
  </div>
  <div id="np"></div>
  <div class="panel" id="status">
   <h4 data-i="sth"></h4><p class="sub" data-i="sts"></p>
   <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    <div class="stat"><b data-i="sup"></b><span data-i="sapi"></span></div>
    <div class="stat"><b data-i="sup"></b><span data-i="sdb"></span></div>
   </div>
   <p class="note" data-i="snote"></p>
  </div>
 </div>
</div>

<h2 id="soon" data-i="h3"></h2><p class="sub" data-i="h3s"></p>
<div class="soon">
 <div><b data-i="k1"></b><span class="tag" data-i="ph2"></span><p data-i="k1p"></p></div>
 <div><b data-i="k2"></b><span class="tag" data-i="ph3"></span><p data-i="k2p"></p></div>
 <div><b data-i="k3"></b><span class="tag" data-i="ph4"></span><p data-i="k3p"></p></div>
</div>
<footer><p data-i="disc"></p></footer>
</div>

function rOnb(){const o=$('onb'),v=OB||{n:ME.name,sx:PF.sx||'',dob:DOB,h:HT||'',w:WT||'',j:PF.job||'',sm:PF.sm||'',ch:PF.ch||'',ct:PF.ct||'',e:''},sel=(x,y)=>x==y?'selected':'';
 o.innerHTML=`<form class="res" id="of" style="max-width:520px;margin:0 auto;padding:22px;display:grid;gap:12px"><h4>${B('لنتعرّف عليكِ','Let’s get to know you')}</h4><p class="sub" style="margin:0">${B('بضعة أسئلة لتجهيز ملفك وتخصيص قسم نمط الحياة. يمكنك تعديلها لاحقًا.','A few questions to set up your profile and personalize Lifestyle. You can edit them later.')}</p>
 <label>${B('الاسم','Name')}<input id="ob_n" maxlength="120" value="${esc(v.n)}"></label>
 <label>${B('الجنس','Sex')}<select id="ob_sx"><option value="">—</option><option value="f" ${sel(v.sx,'f')}>${B('أنثى','Female')}</option><option value="m" ${sel(v.sx,'m')}>${B('ذكر','Male')}</option></select></label>
 <label>${B('تاريخ الميلاد (يُحسب منه العمر)','Date of birth (age is calculated)')}<input id="ob_dob" type="date" value="${v.dob}"></label>
 <label>${B('الطول (سم)','Height (cm)')}<input id="ob_h" type="number" value="${v.h}"></label>
 <label>${B('الوزن (كجم)','Weight (kg)')}<input id="ob_w" type="number" step="0.1" value="${v.w}"></label>
 <label>${B('العمل','Occupation')}<input id="ob_j" maxlength="120" value="${esc(v.j)}"></label>
 <label>${B('هل تدخّنين؟','Do you smoke?')}<select id="ob_sm"><option value="">—</option><option value="no" ${sel(v.sm,'no')}>${B('لا','No')}</option><option value="yes" ${sel(v.sm,'yes')}>${B('نعم','Yes')}</option><option value="former" ${sel(v.sm,'former')}>${B('مدخّن سابق','Former smoker')}</option></select></label>
 <label>${B('هل لديك مرض مزمن؟','Do you have a chronic condition?')}<select id="ob_ch"><option value="">—</option><option value="no" ${sel(v.ch,'no')}>${B('لا','No')}</option><option value="yes" ${sel(v.ch,'yes')}>${B('نعم','Yes')}</option></select></label>
 <label>${B('إن وُجد، ما هو؟ (اختياري)','If yes, which? (optional)')}<input id="ob_ct" maxlength="200" value="${esc(v.ct)}"></label>
 ${v.e?`<p role="alert" style="color:var(--deep);margin:0">${v.e}</p>`:''}<button class="btn fill">${B('حفظ ومتابعة','Save and continue')}</button><p class="note" style="margin:0">${B('بياناتك تُحفظ على هذا الجهاز فقط. لا تُدخلي بيانات مرضى حقيقية.','Your data is stored on this device only. Do not enter real patient data.')}</p></form>`;
 $('of').onsubmit=ev=>{ev.preventDefault();const g=i=>$(i).value.trim(),h=+g('ob_h'),w=+g('ob_w'),a=age(g('ob_dob')),x={n:g('ob_n'),sx:g('ob_sx'),dob:g('ob_dob'),h:g('ob_h'),w:g('ob_w'),j:g('ob_j'),sm:g('ob_sm'),ch:g('ob_ch'),ct:g('ob_ct')};
  x.e=x.n.length<2?B('اكتبي اسمك.','Enter your name.'):!x.sx?B('اختاري الجنس.','Select sex.'):(a===null||a<0||a>120)?B('أدخلي تاريخ ميلاد صحيحًا.','Enter a valid date of birth.'):!(h>=50&&h<=250)?B('الطول بين 50 و250 سم.','Height must be 50–250 cm.'):!(w>=2&&w<=400)?B('الوزن بين 2 و400 كجم.','Weight must be 2–400 kg.'):(!x.sm||!x.ch)?B('أجيبي عن التدخين والمرض المزمن.','Answer the smoking and chronic condition questions.'):'';
  if(x.e){OB=x;rOnb();return}
  OB=null;DOB=x.dob;HT=h;WT=w;PF={...PF,sx:x.sx,job:x.j,sm:x.sm,ch:x.ch,ct:x.ct,done:true};ME.name=x.n;BM=BM.filter(m=>m.d!=td());BM.unshift({d:td(),ht:h,wt:w,bmi:w/((h/100)**2)});
  const us=LS.g('liva:users',[]),u=us.find(z=>z.id==UID);if(u){u.name=x.n;LS.s('liva:users',us)}
  commit();showTab('life');LT='ov';rLife()}}
const addForm=()=>`<div class="res"><h5>${B('إضافة دواء','Add a medication')}</h5><div class="row"><label>${B('الاسم','Name')}<input id="nm" maxlength="200"></label><label>${B('التركيز','Strength')}<input id="ns" maxlength="60" style="width:100px"></label><label>${B('طريقة الاستخدام','How it’s taken')}<input id="nr" maxlength="120"></label><label>${B('التصنيف','Category')}<select id="nc">${Object.keys(CAT).map(k=>`<option value="${k}">${CAT[k][I()]}</option>`).join('')}</select></label><button class="pk" data-a="addmed">${B('إضافة','Add')}</button></div></div>`;
function rWho(){const w=$('who');if(w)w.textContent=UID?B(`مسجّلة الدخول كـ ${ME.name}. بياناتك محفوظة على هذا الجهاز والمتصفح فقط.`,`Signed in as ${ME.name}. Your data is saved on this device and browser only.`):'';
 if(!UID)return;
 const e=document.querySelector('#dash [data-i=wel]');if(e)e.textContent=B(`أهلًا، ${ME.name}`,`Welcome, ${ME.name}`);
 const pc=Math.round([!!DOB,HT>0,WT>0,MEDS.length>0,!!(HX||AL||LF)].filter(Boolean).length/5*100),wp=document.querySelector('#dash [data-i=welp]');
 if(wp)wp.textContent=B(`اكتمل ${pc}% من ملفك الصحي.`,`Your health profile is ${pc}% complete.`);
 const bar=document.querySelector('#dash .bar');bar.setAttribute('aria-valuenow',pc);bar.firstElementChild.style.width=pc+'%';
 const act=MEDS.filter(m=>m.st=='a'),c=[act.filter(m=>m.c=='chronic').length,act.filter(m=>m.c=='acute').length,act.filter(m=>m.c=='supp'||m.c=='herbal').length];
 document.querySelectorAll('#dash .stat b').forEach((x,k)=>x.textContent=c[k]);
 const tb=document.querySelector('#dash tbody');if(tb)tb.innerHTML=MEDS.length?MEDS.slice(0,6).map(m=>`<tr><td><b>${esc(m.n)}</b><small>${esc(m.s)}</small></td><td>${esc(m.r[I()])}</td><td><span class="st ${m.st=='a'?'s-a':m.st=='h'?'s-h':'s-d'}">${ST[m.st][I()]}</span></td><td>${m.sd||''}</td></tr>`).join(''):`<tr><td colspan="4" style="color:var(--tx2)">${B('لا توجد أدوية بعد. أضيفي أول دواء من «إدارة الأدوية».','No medications yet. Add your first one in “Medication Management”.')}</td></tr>`}
np.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(a=='fc')FC=t.dataset.v;else if(a=='done'){const i=+t.dataset.id;DONE.has(i)?DONE.delete(i):DONE.add(i)}else if(a=='lang'){L=t.dataset.v;apply();return}else if(a=='addmed'){const n=$('nm').value.trim();if(!n)return;const r=$('nr').value.trim()||'—';MEDS.unshift({id:Math.max(0,...MEDS.map(m=>m.id))+1,n,s:$('ns').value.trim(),c:$('nc').value,r:[r,r],st:'a',t:'08:00',sd:new Date().toISOString().slice(0,10)})}else if(a=='reset'){if(CF){load(JSON.parse(DEF));CF=false}else CF=true}else if(a=='nocf')CF=false;else if(a=='onb'){PF.done=false;OB=null}else if(CL[a]){if(CL[a](t)===false)return}else if(a=='logout'){logout();return}else if(a=='examples'){let id=Math.max(0,...MEDS.map(m=>m.id));EX.forEach(m=>MEDS.push({...JSON.parse(JSON.stringify(m)),id:++id}))}else if(a=='addrep'){const n=$('rn').value.trim();if(!n)return;RP.unshift({id:Date.now(),n,v:$('rv').value.trim(),u:$('ru').value.trim(),rf:$('rr').value.trim(),d:$('rd').value})}else return;commit()});
apply();
try{const sid=LS.g('liva:session',null),u=sid&&LS.g('liva:users',[]).find(x=>x.id==sid);if(u)startSession(u)}catch(e){}
document.querySelectorAll('[data-i=login]').forEach(e=>e.addEventListener('click',ev=>{if(UID){ev.preventDefault();logout()}else{AM='login';AE='';rAuth()}}));
document.querySelectorAll('[data-i=create]').forEach(e=>e.addEventListener('click',()=>{if(!UID){AM='register';AE='';rAuth()}}));
</script>
